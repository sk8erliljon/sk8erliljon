name: Metrics

on:
  # Schedule updates (every 3 hours)
  schedule:
    - cron: "0 */3 * * *"

  workflow_dispatch:

  push:
    branches:
      - master
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    concurrency:
      group: metrics-update
      cancel-in-progress: true

    steps:
      - uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.GH_PAT }}

          # Enable plugin system
          plugins_errors_fatal: no

          # Base panels
          user: sk8erliljon
          template: classic
          base: header, community, repositories, metadata
          config_timezone: Europe/London

          # Introduction
          plugin_introduction: yes
          plugin_introduction_title: yes

          # People
          plugin_people: yes
          plugin_people_types: followers, following
          plugin_people_limit: 28

          # Repositories
          plugin_repositories: yes
          plugin_repositories_affiliations: owner, collaborator

          # Gists
          plugin_gists: yes

          # Starlists
          plugin_starlists: yes

          # Discussions
          plugin_discussions: yes
          plugin_discussions_categories_limit: 8

          # Topics
          plugin_topics: yes
          plugin_topics_limit: 15
          plugin_topics_mode: icons

          # Code snippet stats
          plugin_code: yes
          plugin_code_languages: yes
          plugin_code_load: 400

          # GitHub contributions calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Languages
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 12

          # Follow-up metrics
          plugin_followup: yes

          # Output file
          filename: metrics.svg
